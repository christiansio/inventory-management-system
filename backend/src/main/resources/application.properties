spring.application.name=ims

spring.config.import=optional:file:./.env[.properties]

# CORS
ims.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# DATABASE CONNECTION
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HIBERNATE SCHEMA MANAGEMENT
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_WITH_TIMEZONE

# SQL LOGGING (DEVELOPMENT ONLY)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# ENTITY MANAGER
spring.jpa.open-in-view=false

# TIME HANDLING
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

auth.session.expiration=${AUTH_SESSION_EXPIRATION}